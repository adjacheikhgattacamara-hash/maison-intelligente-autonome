<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Connexion — Maison Intelligente Autonome</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="icon" type="image/png" href="/logo.png" />
<style>
  :root {
    --bg: #0A0F1E;
    --card: #131C33;
    --card-alt: #1C2745;
    --border: rgba(255,255,255,0.08);
    --accent: #22D3EE;
    --text: #F8FAFC;
    --muted: #92A0C0;
    --danger: #F87171;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .login-card {
    width: 100%; max-width: 360px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 28px;
  }
  .brand-mark {
    width: 52px; height: 52px;
    border-radius: 12px;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 18px;
    overflow: hidden;
  }
  .brand-mark img {
    width: 100%; height: 100%;
    object-fit: contain;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-size: 21px;
    margin: 0 0 4px;
  }
  p.sub { color: var(--muted); font-size: 13px; margin: 0 0 24px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  input {
    width: 100%;
    background: var(--card-alt);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 14px;
    margin-bottom: 16px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    width: 100%;
    background: var(--accent);
    color: #0A0F1E;
    border: none;
    border-radius: 8px;
    padding: 11px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { opacity: 0.92; }
  #errorMsg {
    color: var(--danger);
    font-size: 12px;
    margin-top: 12px;
    min-height: 16px;
  }
</style>
</head>
<body>
  <div class="login-card">
    <div class="brand-mark">
      <img src="/logo.png" alt="ACGC" />
    </div>
    <h1>Maison Intelligente Autonome</h1>
    <p class="sub">Connecte-toi pour accéder au dashboard</p>

    <form id="loginForm">
      <label for="username">Identifiant</label>
      <input type="text" id="username" autocomplete="username" required />

      <label for="password">Mot de passe</label>
      <input type="password" id="password" autocomplete="current-password" required />

      <button type="submit">Se connecter</button>
      <p id="errorMsg"></p>
    </form>
  </div>

<script>
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    const errorMsg = document.getElementById("errorMsg");
    errorMsg.textContent = "";

    try {
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (data.ok) {
        window.location.href = "/";
      } else {
        errorMsg.textContent = data.error || "Connexion impossible";
      }
    } catch {
      errorMsg.textContent = "Erreur réseau, réessaie";
    }
  });
</script>
</body>
</html>
